<div class="container-layout flex flex-col items-center justify-center p-6 gap-5 text-center max-w-md mx-auto">
  <div class="h-14 w-14 rounded-full bg-primary-light flex items-center justify-center">
    <span class="text-2xl">
      <ico name="envelope" size="md"></ico>
    </span>
  </div>
  <div class="flex flex-col gap-2">
    <h1 class="text-xl font-semibold title-font">Verify your email</h1>
    <p class="text-sm text-secondary font-light">
      We sent a verification link to
      <span class="font-medium text-primary">{{ email }}</span>. Click it to
      finish setting up your account, then tap the button below.
    </p>
  </div>

  <div class="flex flex-col gap-2 w-full">
    <div class="flex flex-col">
      <button
        type="button"
        class="button-primary rounded-xl py-3 w-full disabled:opacity-60"
        [disabled]="checking()"
        (click)="onCheck()"
      >
        {{ checking() ? 'Checking…' : "I've verified my email" }}
      </button>

      <div class="bg-secondary-light rounded-xl p-3 mt-2 flex flex-col gap-1">
        <p class="text-sm font-light text-center">
          Didn't receive the email?
        </p>
        <p class="text-sm text-secondary font-light text-center">
          Check your spam folder or try resending it.
        </p>
        <button
          type="button"
          class="rounded-xl py-3 mt-2 w-full card text-primary font-medium disabled:opacity-60 flex items-center justify-center gap-2"
          [disabled]="resending()"
          (click)="onResend()"
        >
          {{ resending() ? 'Sending…' : 'Resend verification email' }}
          <ico name="paper-airplane" size="sm"></ico>
        </button>
      </div>
    </div>

    <button
      type="button"
      class="button-primary rounded-xl py-3 w-full mt-5"
      (click)="onSignOut()"
    >
      Sign out
      <ico name="arrow-right-from-bracket" size="sm"></ico>
    </button>
  </div>
</div>
